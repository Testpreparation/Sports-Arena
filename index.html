/* BADMINTON ARENA UI COMPONENT LIBRARY — current UI (① 現行UI) adaptation; PRO v7 excluded.

:root{--bg0:#060b13;--bg1:#0c1727;--bg2:#13233a;--gold:#b08a34;--gold2:#d9b86c;--gold3:#8a6d2f;--iv:#13263d;--lt:#fff;--mu:#5f7389;--hl:rgba(19,38,61,.16);--cr:#e8523a;--ok:#169a62;--ease:cubic-bezier(.2,.7,.2,1);--fd:"Barlow Condensed","Noto Sans JP",sans-serif;--fb:"Noto Sans JP","Barlow Condensed",system-ui,"Hiragino Sans","Yu Gothic",sans-serif}
html,body{font-family:var(--fb);-webkit-font-smoothing:antialiased}

#gtop{position:relative;align-self:center;display:grid;grid-template-columns:minmax(150px,1fr) minmax(68px,auto) minmax(150px,1fr);align-items:stretch;width:max-content;min-width:min(94vw,360px);margin:calc(env(safe-area-inset-top,0px) + 10px) auto 0;padding:0!important;overflow:hidden;background:rgba(6,11,19,.92)!important;border:0!important;border-radius:3px!important;box-shadow:inset 0 0 0 1px var(--hl),0 12px 22px -10px #000;font-variant-numeric:tabular-nums;text-align:left;backdrop-filter:blur(12px);animation:badHudIn .5s both}

function lobby(){show('lobby');const host=F.role==='host';$('lCode').textContent=F.code;$('lTitle').textContent=host?'ルーム (ホスト)':'ルーム (ゲスト)';
 $('hostCfg').style.display=host?'flex':'none';$('guestCfg').style.display=host?'none':'block';
 $('slotH').innerHTML=`<b>${host?'あなた (ホスト)':'ホスト'}</b><span>${host?'準備OK':'設定中'}</span>`;
 $('slotG').innerHTML=F.guest?`<b>${host?'ゲスト':'あなた (ゲスト)'}</b><span class="ok">入室済み</span>`:`<b>ゲスト</b><span class="dim">待機中...</span>`;$('slotG').classList.toggle('empty',!F.guest);
 const sc=$('sportChips');sc.innerHTML='';for(const id of SPORTS){const b=document.createElement('button');b.className='chip'+(F.sport===id?' sel':'');b.textContent=SP[id].icon+' '+SP[id].name;b.onclick=()=>{F.sport=id;lobby()};sc.appendChild(b)}
 const fc=$('fmtChips');fc.innerHTML='';for(const d of[false,true]){const b=document.createElement('button');b.className='chip'+(F.dbl===d?' sel':'');b.textContent=fmtName(F.sport,d);b.onclick=()=>{F.dbl=d;lobby()};fc.appendChild(b)}
 $('gInfo').textContent=SP[F.sport].icon+' '+SP[F.sport].name+' / '+fmtName(F.sport,F.dbl);
 const w=$('wait');if(host){if(F.guest){w.dataset.base='';w.textContent='ゲストが入室しました。試合を開始できます'}else{w.dataset.base='ゲストを待っています';w.textContent='ゲストを待っています'}}else{w.dataset.base='ホストの開始を待っています';w.textContent='ホストの開始を待っています'}
 $('bStart').style.display=host?'block':'none';$('bStart').disabled=!F.guest;$('bSim').textContent=host?'(テスト) ゲストを入室させる':'(テスト) ホストが試合を開始する';$('bSim').style.display=(host&&F.guest)?'none':'block'}
$('bSim').onclick=()=>{if(F.role==='host'){F.guest=true;lobby()}else startFriend()};
$('bStart').onclick=()=>{if(F.guest)startFriend()};$('bLeave').onclick=()=>show('friend');
$('bCopy').onclick=()=>{try{navigator.clipboard.writeText(F.code)}catch(e){}$('bCopy').textContent='コピーしました';setTimeout(()=>$('bCopy').textContent='コピー',1200)};
function startFriend(){cur.friend=true;flow.sport=F.sport;setMenuVis(false);setupMatch(F.sport,F.dbl);cur.friend=true;hudBuild();show('hud')}
setMenuVis(true);requestAnimationFrame(loop);
window.Arena={makeChar,makeRacket,makeBall,SP,createMatch};

</script></body></html>
